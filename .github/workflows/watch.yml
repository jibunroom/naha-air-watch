name: watch

# GitHub の schedule は「指定時刻に1回」を守らない（入札監視の実績: 1日2〜4回・時刻バラバラ）。
# 20分おきに起動を試みさせ、実際に走るかは gate（src/slots.py）が決める。
# スロットは JST 07:00〜 の morning（仕様）と 18:00〜 の evening（短いセールを逃さないため）。
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: gate（このスロットを走らせるか判定）
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "due=manual" >> "$GITHUB_OUTPUT"
          else
            python3 -m src.slots >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.due != 'none'
        with:
          python-version: '3.12'
          cache: pip

      - if: steps.gate.outputs.due != 'none'
        run: pip install -r requirements.txt

      - name: run
        if: steps.gate.outputs.due != 'none'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          git config user.name  "naha-air-watch[bot]"
          git config user.email "actions@github.com"
          python -m src.main
