  タイガーエア台湾:     {aliases: [タイガーエア・台湾, Tigerair Taiwan, 台湾虎航], type: LCC, naha: true}
  チャイナエアライン:   {aliases: [中華航空, China Airlines], type: 大手, naha: true}
