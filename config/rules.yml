  スターラックス航空:   {aliases: [スターラックス, STARLUX], type: 大手, naha: true}
  イースター航空:       {aliases: [イースタージェット, Eastar Jet], type: LCC, naha: true}
  トリニティ航空:       {aliases: [ティーウェイ航空, ティーウェイ, "T'way"], type: LCC, naha: true}
  ジンエアー:           {aliases: [Jin Air], type: LCC, naha: true}
